<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="regarderunepub.css">
</head>

<body>

<header class="header">
  <h1>Social App</h1>
</header>

<section class="box">
  <a href="/mvp/thersan/evenement-page/evenement.html"><img src="../../publicités/Assets/7792318.png" alt="Retour" class="img"></a> Obtenir des billets<br>
  Regardez des pubs ou achetez des packs
</section>
<section class="balance">
  <span id="tickets">12</span>
</section>

<section class="premium">
  <a href="/mvp/pierre/abonnements-page/abonnements.html"><button class="btn-premium" style="background-color: transparent;border: none; color: white;align-items: center;justify-content: center;width: 100%;">👑 Passez Premium<br><p>
    Plus de billets chaque jour.<br>
    À partir de 3,99€/mois
  </p></button></a>
</section>

<section class="box">
  <button id="watch" class="btn-main">Regarder une pub</button>
  <p class="center">+1 billet</p>

  <p>
    Aujourd'hui <span id="seen">0</span>/5<br>
    Reste <span id="left">5</span>
  </p>
</section>

<section class="box">
  💳 Acheter des billets<br><br>

  <button class="btn-buy">5 billets – 0,99€</button>
  <button class="btn-buy">15 billets – 12,49€</button>
  <button class="btn-buy">40 billets – 25,99€</button>
  <button class="btn-buy">100 billets – 32,99€</button>
</section>

<section class="box info">
  ℹ️ Bon à savoir<br><br>
  • 5 pubs max / jour<br>
  • billets illimités si achetés<br>
  • jamais expirés
</section>

<footer>
        <nav class="container-tabar">
            <ul class="list">
                <li><a href="../home/home.html">Home</a></li>
                <li><a href="../../pierre/reel-page/reel.html">Reel</a></li>
                <li><a href="../../mathias/recompense-page/recompense.html">Pubs</a></li> 
                <li><a href="../../mathias/messages-page/messages.html">Chat</a></li>
                <li><a href="../../pierre/profil-page/profil.html">Profil</a></li>
            </ul>
        </nav>
    </footer>

<script>
let tickets = 12;
let seen = 0;
const max = 5;

const ticketsEl = document.getElementById("tickets");
const seenEl = document.getElementById("seen");
const leftEl = document.getElementById("left");
const btn = document.getElementById("watch");

btn.onclick = () => {
  if (seen >= max) return alert("Limite atteinte");

  seen++;
  tickets++;

  ticketsEl.textContent = tickets;
  seenEl.textContent = seen;
  leftEl.textContent = max - seen;

  if (seen === max) {
    btn.textContent = "Limite atteinte";
    btn.disabled = true;
  }
};
</script>

</body>
</html>
